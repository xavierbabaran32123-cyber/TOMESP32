name: Build Android APK

on:
  push:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Android SDK 36.1 & Build Tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sudo mkdir -p "$SDK_ROOT"
          sudo chown -R "$(id -u):$(id -g)" "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o /tmp/cmdtools.zip
          rm -rf /tmp/cmdtools "$SDK_ROOT/cmdline-tools/latest"
          mkdir -p /tmp/cmdtools "$SDK_ROOT/cmdline-tools"
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          mv /tmp/cmdtools/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

      - name: Install Gradle 9.3.1
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle.zip
          sudo mkdir -p /opt/gradle
          sudo unzip -q -o /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-9.3.1/bin" >> "$GITHUB_PATH"

      - name: Prepare environment & debug signing keystore
        run: |
          [ -f .env.example ] || touch .env.example
          [ -f .env ] || cp .env.example .env

          if [ -s debug.keystore.base64 ]; then
            tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore || rm -f debug.keystore
          fi
          if [ ! -s debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Package APK output
        run: cp app/build/outputs/apk/debug/app-debug.apk Mask-Controller.apk

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Mask-Controller-APK
          path: Mask-Controller.apk

      - name: Publish APK to GitHub Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          if [ -z "$RELEASE_TAG" ]; then
            RELEASE_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
          fi

          if [ -n "$RELEASE_TAG" ]; then
            gh release upload "$RELEASE_TAG" Mask-Controller.apk --clobber
          else
            gh release create v1.0.0 Mask-Controller.apk \
              --title "Mask Controller v1.0.0" \
              --notes "Installable Android APK for Mask Controller."
          fi
